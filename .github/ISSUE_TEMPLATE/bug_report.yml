name: Bug report
description: Something in YTLiveChat does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. Please do not report security
        vulnerabilities here — use a [private advisory](../../security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal snippet is worth far more than a description.
      render: csharp
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 0.1.2
    validations:
      required: true
  - type: dropdown
    id: tfm
    attributes:
      label: Target framework
      options: ["net11.0", "net10.0", "net9.0", "netstandard2.1", "netstandard2.0", "other"]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11 26100, Ubuntu 24.04, macOS 15.2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: Redact tokens and personal data before pasting.
      render: text
